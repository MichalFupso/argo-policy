apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: sec-policy2
spec:
  egress:
    - action: Allow
      protocol: TCP
      destination: {}
      source: {}
    - action: Allow
      protocol: UDP
      destination: {}
      source: {}
    - action: Allow
      protocol: ICMP
      destination: {}
      source: {}
  ingress:
    - action: Allow
      destination: {}
      source: {}
  tier: security
  types:
    - Ingress
    - Egress
